[package]
name = "t2-remote"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Manage Apple T2 RemoteXPC services over the bridge link"

[[bin]]
name = "t2remote"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
t2-bridgexpc = { path = "../../protocols/t2-bridgexpc" }
uuid = "1.18"
