name: Deploy site

on:
  push:
    branches: [main]

  pull_request:
    paths:
      - site.yml
      - docs/**
      - blog/**
      - pages/**
      - web/**
      - scripts/site/**
      - scripts/upstream/**
      - data/features.yml
      - requirements-docs.txt
      - .github/workflows/pages.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-root
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install site dependencies
        run: pip install -r requirements-docs.txt

      - name: Build the site
        run: python scripts/site/build.py

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./site
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ./site

      - name: Publish to kait2en.org
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
          external_repository: kaiT2en/kait2en.github.io
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          cname: kait2en.org
