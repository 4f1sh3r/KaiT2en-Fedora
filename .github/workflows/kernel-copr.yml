name: Build COPR test kernel

on:
  pull_request:
    paths:
      - patches/testing/**
      - '!patches/testing/**/README.md'
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment directory name below patches/testing
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: kernel-copr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  COPR_CHROOT: fedora-44-x86_64
  COPR_PROJECT: ${{ vars.COPR_PROJECT || '4lex404/kait2en-kernel-testing' }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: copr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select experiment
        id: experiment
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_EXPERIMENT: ${{ inputs.experiment }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ $EVENT_NAME == pull_request ]]; then
            mapfile -t experiments < <(
              git diff --name-only --diff-filter=ACMRT \
                "$BASE_SHA" "$SOURCE_SHA" -- patches/testing/ |
                awk -F/ 'NF >= 4 { print $3 }' |
                LC_ALL=C sort -u
            )
            if ((${#experiments[@]} != 1)); then
              printf 'Expected exactly one changed experiment, found %d:\n' \
                "${#experiments[@]}" >&2
              printf '  %s\n' "${experiments[@]}" >&2
              exit 1
            fi
            experiment=${experiments[0]}
          else
            experiment=$MANUAL_EXPERIMENT
          fi

          [[ $experiment =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
            printf 'Invalid experiment name: %s\n' "$experiment" >&2
            exit 1
          }
          experiment_dir=patches/testing/$experiment
          [[ -s $experiment_dir/README.md && -s $experiment_dir/series ]] || {
            printf '%s must contain non-empty README.md and series files\n' \
              "$experiment_dir" >&2
            exit 1
          }

          suffix=${experiment//-/_}.g${SOURCE_SHA::7}
          {
            echo "name=$experiment"
            echo "directory=$experiment_dir"
            echo "suffix=$suffix"
          } >>"$GITHUB_OUTPUT"

      - name: Create and validate kernel SRPM
        id: srpm
        shell: bash
        env:
          BUILD_SUFFIX: ${{ steps.experiment.outputs.suffix }}
          EXPERIMENT_DIR: ${{ steps.experiment.outputs.directory }}
        run: |
          set -Eeuo pipefail
          mkdir -p out
          podman run --rm \
            --volume "$PWD:/repo:ro" \
            --volume "$PWD/out:/out" \
            --env GITHUB_OUTPUT=/out/github-output \
            fedora:44 \
            bash -euo pipefail -c '
              dnf -y install dnf5-plugins rpm-build
              bash /repo/scripts/copr/make-kernel-srpm.sh \
                --buildid "$1" --patch-dir "/repo/$2" --out /out
            ' bash "$BUILD_SUFFIX" "$EXPERIMENT_DIR"
          cat out/github-output >>"$GITHUB_OUTPUT"
          test -s "out/$(sed -n 's/^srpm_name=//p' out/github-output)"

      - name: Check COPR credential
        id: credential
        shell: bash
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [[ -z $COPR_CONFIG ]]; then
            echo '::notice::COPR_CONFIG is empty; SRPM validation passed, COPR submission skipped.'
            echo 'enabled=false' >>"$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >>"$GITHUB_OUTPUT"
          fi

      - name: Install COPR client
        if: steps.credential.outputs.enabled == 'true'
        run: python3 -m pip install copr-cli

      - name: Configure COPR client
        if: steps.credential.outputs.enabled == 'true'
        shell: bash
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          umask 077
          mkdir -p "$HOME/.config"
          printf '%s' "$COPR_CONFIG" >"$HOME/.config/copr"

      - name: Submit COPR build
        if: steps.credential.outputs.enabled == 'true'
        id: submit
        shell: bash
        env:
          SRPM_NAME: ${{ steps.srpm.outputs.srpm_name }}
        run: |
          set -Eeuo pipefail
          output=$(copr-cli build --nowait --timeout 18000 \
            --chroot "$COPR_CHROOT" \
            "$COPR_PROJECT" "out/$SRPM_NAME")
          printf '%s\n' "$output"
          build_id=$(
            printf '%s\n' "$output" |
              sed -nE \
                -e 's#.*coprs/build/([0-9]+)/?.*#\1#p' \
                -e 's/^Created builds:[[:space:]]*([0-9]+).*$/\1/p' |
              tail -n 1
          )
          [[ $build_id =~ ^[0-9]+$ ]] || {
            echo 'Could not determine COPR build ID.' >&2
            exit 1
          }
          build_url="https://copr.fedorainfracloud.org/coprs/build/$build_id/"
          echo "build_id=$build_id" >>"$GITHUB_OUTPUT"
          echo "build_url=$build_url" >>"$GITHUB_OUTPUT"

      - name: Publish build-started comment
        if: >-
          github.event_name == 'pull_request'
          && steps.submit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_URL: ${{ steps.submit.outputs.build_url }}
          EXPERIMENT: ${{ steps.experiment.outputs.name }}
          NVR: ${{ steps.srpm.outputs.nvr }}
          KVER: ${{ steps.srpm.outputs.kver }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          comment=/tmp/kernel-copr-comment.md
          {
            echo '<!-- kait2en-copr -->'
            echo 'COPR test kernel build started.'
            echo
            echo "- Experiment: \`$EXPERIMENT\`"
            echo "- Build: $BUILD_URL"
            echo "- COPR: \`$COPR_PROJECT\`"
            echo "- Kernel NVR: \`$NVR\`"
            echo "- Kernel release: \`$KVER\`"
          } >"$comment"
          cat "$comment" >>"$GITHUB_STEP_SUMMARY"
          comment_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- kait2en-copr -->")) | .id' |
            tail -n 1)
          if [[ -n $comment_id ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F "body=@$comment" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body-file "$comment"
          fi

      - name: Wait for COPR build
        if: steps.submit.outcome == 'success'
        env:
          BUILD_ID: ${{ steps.submit.outputs.build_id }}
        run: copr-cli watch-build "$BUILD_ID"

      - name: Publish successful build result
        if: success() && steps.submit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_URL: ${{ steps.submit.outputs.build_url }}
          EXPERIMENT: ${{ steps.experiment.outputs.name }}
          NVR: ${{ steps.srpm.outputs.nvr }}
          KVER: ${{ steps.srpm.outputs.kver }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          comment=/tmp/kernel-copr-comment.md
          sed \
            -e "s|@EXPERIMENT@|$EXPERIMENT|g" \
            -e "s|@COPR_PROJECT@|$COPR_PROJECT|g" \
            -e "s|@NVR@|$NVR|g" \
            -e "s|@KVER@|$KVER|g" \
            -e "s|@BUILD_URL@|$BUILD_URL|g" \
            scripts/copr/pr-comment.md.in >"$comment"
          cat "$comment" >>"$GITHUB_STEP_SUMMARY"
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            comment_id=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- kait2en-copr -->")) | .id' |
              tail -n 1)
            [[ -n $comment_id ]]
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F "body=@$comment" >/dev/null
          fi

      - name: Publish failed build result
        if: failure() && steps.submit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_URL: ${{ steps.submit.outputs.build_url }}
          EXPERIMENT: ${{ steps.experiment.outputs.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          comment=/tmp/kernel-copr-comment.md
          {
            echo '<!-- kait2en-copr -->'
            echo 'COPR test kernel build failed.'
            echo
            echo "- Experiment: \`$EXPERIMENT\`"
            echo "- Build and builder-live.log: $BUILD_URL"
          } >"$comment"
          cat "$comment" >>"$GITHUB_STEP_SUMMARY"
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            comment_id=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- kait2en-copr -->")) | .id' |
              tail -n 1)
            if [[ -n $comment_id ]]; then
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
                -F "body=@$comment" >/dev/null
            else
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body-file "$comment"
            fi
          fi

      - name: Cancel interrupted COPR build
        if: cancelled() && steps.submit.outputs.build_id != ''
        env:
          BUILD_ID: ${{ steps.submit.outputs.build_id }}
        run: copr-cli cancel "$BUILD_ID"
